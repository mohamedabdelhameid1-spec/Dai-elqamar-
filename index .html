<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080b"><meta name="color-scheme" content="dark">
<title>منيو ضي القمر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap">
<style>
:root{--ink:#07080b;--panel:#0f1117;--gold:#e9a845;--gold-l:#f6d58c;--cream:#f3e6c8;--dim:#9a8b6c;box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--ink);color:var(--cream);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;font-weight:500;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:30}
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 38%,#2a1d08 0%,#120d05 38%,var(--ink) 72%)}
.hero img{width:min(90vw,640px);filter:drop-shadow(0 0 22px rgba(255,190,90,.5));animation:glow 4.5s ease-in-out infinite;will-change:transform}
.hero.off img,.hero.off .hint{animation-play-state:paused}
@keyframes glow{50%{transform:scale(1.03)}}
.tag{font-size:22px;font-weight:800;color:var(--gold-l);letter-spacing:.02em}
.hint{color:var(--dim);font-size:15px;animation:nudge 2.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(8px)}}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#07080b;will-change:transform;border-bottom:1px solid #2a2314;display:flex;gap:8px;overflow-x:auto;padding:12px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--cream);text-decoration:none;font-size:15px;font-weight:700;padding:7px 16px;border-radius:999px;border:1px solid #3a2f17;transition:background .25s,color .25s}
nav a.on{background:var(--gold);color:#1a1205;border-color:var(--gold)}
nav a:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:6px 18px 40px}
section{padding-top:30px;content-visibility:auto;contain-intrinsic-size:auto 520px}
h2{margin:0 0 14px;font-size:24px;font-weight:800;color:#1a1205;background:linear-gradient(100deg,#c98a2b,#f2c46a 45%,#d99a35);padding:9px 22px;border-radius:6px 26px 6px 26px;display:inline-block}
ul{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid #2a2314;border-radius:14px;padding:6px 16px}
li{display:flex;align-items:baseline;gap:10px;padding:12px 0;font-size:18px;border-bottom:1px solid #1b1810}
li:last-child{border-bottom:0}
li i{flex:1;border-bottom:2px dotted #4a3d1f;transform:translateY(-4px)}
li b{color:var(--gold-l);font-weight:800;font-size:19px;min-width:2.2em;text-align:left;direction:ltr}
footer{text-align:center;padding:40px 20px calc(60px + env(safe-area-inset-bottom,0px));color:var(--gold);font-size:20px;font-weight:800}
@media (prefers-reduced-motion:reduce){.hero img,.hint{animation:none}}
</style></head><body>

<footer>ضي القمر .. دايماً معاك</footer>
<script>
const D=[
["ساخنة","مشروبات ساخنة",[["شاي",10],["شاي فتلة",15],["ينسون",15],["نعناع",15],["كركديه",15],["قرفة",15],["جنزبيل",15],["كوكتيل أعشاب",20],["شاي أخضر",15],["شاي بالقرنفل",30],["نسكافيه بلاك",20]]],
["باللبن","مشروبات ساخنة باللبن",[["حلبة باللبن",30],["قهوة باللبن",30],["نسكافيه باللبن",30],["جنزبيل باللبن",30],["شاي باللبن",20],["كاكاو باللبن",20],["هوت شوكليت",40],["نسكافيه عادي",30],["سحلب مكسرات",35],["هوت موكا",40]]],
["قهوة","قهوة",[["قهوة تركي",20],["قهوة محوج",20],["قهوة غامق",20],["قهوة فرنساوي",30],["قهوة بندق",30]]],
["آيس","آيس كوفي وميلك شيك",[["آيس كوفي",40],["آيس لاتيه",40],["آيس موكا",40],["آيس شوكليت",50],["آيس أوريو",50],["آيس بوريو",50],["توينكز",50]]],
["عصائر","عصائر",[["ليمون عادي",25],["ليمون نعناع",30],["عناب",30],["مانجو",40],["جوافة",35],["فراولة",40],["بلح باللبن",40],["زبادي",35],["زبادي عسل",40],["زبادي فواكه",40]]],
["الحلو","قسم الحلو",[["أم علي مكسرات",35],["أم علي عسل وقشطة",40],["بليلة باللبن وسادة",25],["بليلة باللبن ومكسرات",30]]],
["ساقعة","مشروبات ساقعة",[["بيبسي",30],["سفن",30],["بيريل",30],["ستينج",30],["فيوري",35]]],
["الأساسي","الأساسي",[["مياه كبيرة",20],["مياه صغيرة",10]]],
["شيشة","معسل شيشة",[["قص",10],["سلوم",10],["فواكه",40],["فواكه ميكس",50]]],
["حمص الشام","حمص الشام",[["حمص الشام",25]]]
];
const nav=document.getElementById('nav'),menu=document.getElementById('menu');
D.forEach(([s,t,items],i)=>{
 const a=document.createElement('a');a.href='#s'+i;a.textContent=s;a.id='n'+i;nav.appendChild(a);
 const sec=document.createElement('section');sec.id='s'+i;
 sec.innerHTML='<h2>'+t+'</h2><ul>'+items.map(([n,p])=>'<li><span>'+n+'</span><i></i><b>'+p+'</b></li>').join('')+'</ul>';
 menu.appendChild(sec);
});
const links=[...nav.children];let cur=-1,tick=0;
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const i=+e.target.id.slice(1);if(i===cur)return;cur=i;cancelAnimationFrame(tick);tick=requestAnimationFrame(()=>{links.forEach(l=>l.classList.remove('on'));const l=links[i];l.classList.add('on');l.scrollIntoView({inline:'center',block:'nearest'})})})},{rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('section').forEach(s=>io.observe(s));
const hero=document.querySelector('.hero');
new IntersectionObserver(e=>hero.classList.toggle('off',!e[0].isIntersecting)).observe(hero);
</script></body></html>
